<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Real - Room Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 antialiased">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="mb-10 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-light tracking-tight text-slate-900">Hotel Real</h1>
                <p class="text-sm text-slate-500 mt-1">Room Availability Dashboard</p>
            </div>
            <button onclick="fetchRooms()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">
                Refresh Status
            </button>
        </header>

        <div id="loader" class="flex justify-center py-20">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
        </div>

        <div id="grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 hidden">
            <!-- Room cards injected by JS -->
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
